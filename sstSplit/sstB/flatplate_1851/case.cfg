% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V2003m
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ------------------------ COMPRESSIBLE FREE-STREAM DEFINITION ----------------%
%
MACH_NUMBER= 6.1
AOA= 0.000
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_TEMPERATURE= 800.0
FREESTREAM_PRESSURE= 11788.4
FREESTREAM_TURBULENCEINTENSITY= 0.05
FREESTREAM_TURB2LAMVISCRATIO= 10.0
REF_DIMENSIONALIZATION= DIMENSIONAL
REYNOLDS_NUMBER= 4.9E6

% ---- IDEAL GAS, POLYTPOPIC, VAN DER WALLS AND PENG ROBINSOPN CNSTANTS ------ %
%
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
ACENTRIC_FACTOR= 0.035
SPECIFIC_HEAT_CP= 1004.703
THERMAL_EXPANSION_COEFF= 0.00347
MOLECULAR_WEIGHT= 28.96

% --------------------------- VISCOSITY MODEL ---------------------------------%
%

VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716E-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4

% ------------------------ THERMAL CONDUCTIVITY MODEL -------------------------%
%

CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.9

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%

REF_ORIGIN_MOMENT_X = 0.00
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%

MARKER_PLOTTING = ( wall )
MARKER_SUPERSONIC_INLET= ( inlet, 800.0, 11788.4, 3458.7, 0.0, 0.0 )
MARKER_FAR= ( farfield )
MARKER_SYM= ( symmetry )
MARKER_SUPERSONIC_OUTLET= (outlet, 34384.76396)
MARKER_ISOTHERMAL= ( wall, 300.0 )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.5
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 1.5, 0.5, 50.0 )

% --------- SLOPE LIMITER DEFINITION, DISSIPATION SENSOR DEFINITION -----------------%
%

MUSCL_FLOW= YES 
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN_WANG
SLOPE_LIMITER_TURB= NONE
VENKAT_LIMITER_COEFF= 0.05
JST_SENSOR_COEFF= (0.5, 0.02)

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%

CONV_NUM_METHOD_FLOW= AUSM
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%

CONV_NUM_METHOD_TURB= SCALAR_UPWIND
TIME_DISCRE_TURB= EULER_IMPLICIT

% ------------------------- SCREEN/HISTORY VOLUME OUTPUT --------------------------%
%

SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_TKE, SURFACE_STATIC_TEMPERATURE, SURFACE_MACH)
SCREEN_WRT_FREQ_INNER= 1
SCREEN_WRT_FREQ_OUTER= 1 
SCREEN_WRT_FREQ_TIME= 1
HISTORY_WRT_FREQ_INNER= 1
HISTORY_WRT_FREQ_OUTER= 1 
HISTORY_WRT_FREQ_TIME= 1
OUTPUT_WRT_FREQ= 1000

% ------------------------- INPUT/OUTPUT FILE INFORMATION --------------------------%
%

MESH_FILENAME= mesh_flatplate_turb_137x97.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= restart_flow
SOLUTION_ADJ_FILENAME= solution_adj
CONV_FILENAME= history
BREAKDOWN_FILENAME= forces_breakdown.dat
RESTART_FILENAME= restart_flow
RESTART_ADJ_FILENAME= restart_adj

% ------------------------------- SOLVER CONTROL ------------------------------%
%

ITER= 6000
OUTER_ITER= 1
TIME_ITER= 100
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10
MARKER_ANALYZE= ( inlet )
MARKER_ANALYZE_AVERAGE= AREA
HISTORY_OUTPUT= (ITER, RMS_RES, FLOW_COEFF, AERO_COEFF)
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW)
