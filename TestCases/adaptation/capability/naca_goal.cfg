% Subsonic NACA0012 (QuickStart mesh), Euler, goal-oriented loop (ADAP_SENSOR= GOAL, discrete adjoint of DRAG,
% SU2_CFD_AD). The primal restart solution_flow.dat is made first by the --binary run in DIRECT (run_capability.py).
SOLVER= EULER
MATH_PROBLEM= DISCRETE_ADJOINT
MACH_NUMBER= 0.5
AOA= 1.25
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 273.15
REF_DIMENSIONALIZATION= DIMENSIONAL
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )
MARKER_MONITORING= ( airfoil )
OBJECTIVE_FUNCTION= DRAG
CFL_NUMBER= 50
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
ITER= 100
DISCADJ_LIN_SOLVER= FGMRES
DISCADJ_LIN_PREC= JACOBI
SCREEN_OUTPUT= (INNER_ITER, RMS_ADJ_DENSITY, SENS_AOA)
OUTPUT_WRT_FREQ= 100000
ADAP_SENSOR= (GOAL)
ADAP_NORM= 1
ADAP_SIZES= (3000)
ADAP_SUBITER= (1)
ADAP_FLOW_ITER= (100)
ADAP_ADJ_ITER= (100)
ADAP_HMIN= 1e-4
ADAP_HMAX= 10
ADAP_ARMAX= 1000
ADAP_HAUSD= 0.002
SOLUTION_FILENAME= solution_flow
RESTART_ADJ_FILENAME= restart_adj
VOLUME_ADJ_FILENAME= vol_solution
WRT_RESTART_COMPACT= NO
VOLUME_OUTPUT= (COORDINATES, SOLUTION)
HISTORY_OUTPUT= (ITER, RMS_RES)
