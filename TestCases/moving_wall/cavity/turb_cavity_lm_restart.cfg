%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Restart of a lid-driven cavity with SA and LM transition.  %
%                   The transition variables are written before the grid       %
%                   velocities in the restart file.                            %
% Author: Andrea Rausa                                                         %
% Date: 2026.10.01                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= RANS
KIND_TURB_MODEL= SA
KIND_TRANS_MODEL= LM
FREESTREAM_TURBULENCEINTENSITY= 0.01
MATH_PROBLEM= DIRECT
% The solution file was obtained with RESTART_SOL= NO and ITER= 200
RESTART_SOL= YES

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
MACH_NUMBER= 0.05
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_TEMPERATURE= 288.15
REYNOLDS_NUMBER= 5.0E4
REYNOLDS_LENGTH= 1.0

% ----------------------- DYNAMIC MESH DEFINITION -----------------------------%
%
SURFACE_MOVEMENT= MOVING_WALL
MACH_MOTION= 0.1
MARKER_MOVING= ( upper )
SURFACE_TRANSLATION_RATE= 33.179 0.0 0.0

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX= ( upper, 0.0, left, 0.0, right, 0.0, lower, 0.0 )
MARKER_PLOTTING= ( upper, left, right, lower )
MARKER_MONITORING= ( upper, left, right, lower )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 50
CFL_ADAPT= NO
ITER= 10

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 10

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -12

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= mesh_cavity_stretch.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow_sa_lm.dat
RESTART_FILENAME= restart_flow.dat
OUTPUT_FILES= (RESTART)
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_NU_TILDE, RMS_INTERMITTENCY, DRAG)
